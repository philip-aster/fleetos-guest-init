[package]
name = "fleetos-guest-init"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Philip Aster and the FleetOS Contributors"]
description = "PID 1 init binary for FleetOS Cloud Hypervisor MicroVMs"

[dependencies]
# `vsock-attest` implies `primitives` (crypto + naming) and gates `vsock_proto`,
# but does NOT pull the grpc stack (tonic/prost/rustls) that `minimal` carries.
# This is what keeps the static musl binary under the 2MB budget.
fleetos-core = { path = "../fleetos-core", default-features = false, features = ["vsock-attest"] }
libc = "0.2.189"
# Trait bounds only (Serialize / DeserializeOwned); nothing derives here anymore.
serde = { version = "1.0.229" }

[features]
# Insecure software quote generator for dev/testing ONLY. The agent-side
# vsock-attest verifier MUST reject this quote type in production (fail-closed).
dev-attest = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
