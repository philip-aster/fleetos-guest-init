[package]
name = "fleetos-guest-init"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Philip Aster and the FleetOS Contributors"]
description = "PID 1 init binary for FleetOS Cloud Hypervisor MicroVMs"

[dependencies]
# NOTE: `minimal` currently bundles tonic/prost/rustls/serde_json, which blows
# the <2MB size budget. A fleetos-core feature split is required (see README
# "Blockers"). Using `minimal` here so this compiles against today's core.
fleetos-core = { path = "../fleetos-core", default-features = false, features = ["minimal"] }
libc = "0.2.189"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[features]
# Insecure software quote generator for dev/testing ONLY. The agent-side
# vsock-attest verifier MUST reject this quote type in production (fail-closed).
dev-attest = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
